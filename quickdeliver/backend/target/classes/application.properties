server.port=8080
spring.application.name=quickdeliver-backend

# Data Source configuration (H2 with MySQL 8 Mode for standalone testing; can point to real MySQL via MYSQL_URL)
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:quickdeliverdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false

# Python ETA Prediction Service
python.eta.service.url=${PYTHON_ETA_URL:http://localhost:5000}
